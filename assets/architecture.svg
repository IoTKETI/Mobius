<text x="600" y="33" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#0b2b38">Response</text>
<text x="668" y="33" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#6d8794">and notification</text>
<rect x="598" y="44" width="256" height="66" rx="6" fill="#e9eef8" stroke="#95aed6" stroke-width="1.2"/>
<text x="612" y="64" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="500" fill="#0b2b38">responder.js · shape.js</text>
<text x="612" y="82" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#3d5f6d">builds the JSON body and</text>
<text x="612" y="97" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#3d5f6d">is the single exit</text>
<rect x="598" y="118" width="256" height="58" rx="6" fill="#e9eef8" stroke="#95aed6" stroke-width="1.2"/>
<text x="612" y="138" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="500" fill="#0b2b38">settle.js</text>
<text x="612" y="156" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#3d5f6d">one response and one</text>
<text x="612" y="169" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#3d5f6d">connection return, exactly once</text>
<rect x="598" y="184" width="256" height="62" rx="6" fill="#e9eef8" stroke="#95aed6" stroke-width="1.2"/>
<text x="612" y="204" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="500" fill="#0b2b38">sgn.js · sgn_man.js</text>
<text x="612" y="222" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#3d5f6d">subscription notifications</text>
<text x="612" y="237" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#6d8794">HTTP · CoAP · MQTT</text>
<rect x="12" y="272" width="150" height="86" rx="9" fill="#f4efe2" stroke="#c9b98e" stroke-width="1.2"/>
<text x="28" y="294" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#0b2b38">Storage</text>
<text x="28" y="317" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="400" fill="#0b2b38">MySQL</text>
<text x="28" y="336" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="400" fill="#0b2b38">SQLite</text>
<rect x="174" y="272" width="694" height="86" rx="9" fill="#edf3e7" stroke="#a3c088" stroke-width="1.2"/>
<text x="190" y="294" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#0b2b38">Mobius HTTP server</text>
<text x="320" y="294" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#6d8794">Express</text>
<text x="190" y="317" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#3d5f6d">HTTP is the only request binding</text>
