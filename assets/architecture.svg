<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Mobius 3.0 architecture: a worker handles a request through app.js, security.js, resource.js and sql_action.js, the mobius/db facade reaches MySQL or SQLite, and responses leave through responder.js while sgn.js sends notifications">
<rect width="880" height="470" fill="#ffffff"/>
<rect x="12" y="10" width="560" height="250" rx="9" fill="#f7fafb" stroke="#c3d3d9" stroke-width="1.2"/>
<text x="28" y="33" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#0b2b38">Request path</text>
<text x="126" y="33" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#6d8794">worker process</text>
<rect x="26" y="44" width="532" height="46" rx="6" fill="#e9f4f7" stroke="#88bccb" stroke-width="1.2"/>
<text x="40" y="64" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="500" fill="#0b2b38">app.js</text>
