<text x="220" y="136" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#3d5f6d">create · retrieve</text>
<text x="220" y="151" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#3d5f6d">update · delete</text>
<text x="220" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#3d5f6d">discovery</text>
<rect x="386" y="98" width="172" height="86" rx="6" fill="#e9f4f7" stroke="#88bccb" stroke-width="1.2"/>
<text x="400" y="118" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#0b2b38">sql_action.js</text>
<text x="400" y="136" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#3d5f6d">statements built</text>
<text x="400" y="151" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#3d5f6d">with the query</text>
<text x="400" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#3d5f6d">builder, values bound</text>
