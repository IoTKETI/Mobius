<rect x="26" y="98" width="170" height="86" rx="6" fill="#e9f4f7" stroke="#88bccb" stroke-width="1.2"/>
<text x="40" y="118" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#0b2b38">security.js</text>
<text x="40" y="136" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#3d5f6d">access control</text>
<text x="40" y="151" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#3d5f6d">checked against the</text>
<text x="40" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#3d5f6d">resource policy</text>
