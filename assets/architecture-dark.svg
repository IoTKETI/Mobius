<rect x="26" y="98" width="170" height="86" rx="6" fill="#102b35" stroke="#2b7085" stroke-width="1.2"/>
<text x="40" y="118" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#e6edf3">security.js</text>
<text x="40" y="136" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3b1bb">access control</text>
<text x="40" y="151" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3b1bb">checked against the</text>
<text x="40" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3b1bb">resource policy</text>
