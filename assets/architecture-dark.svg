<text x="220" y="136" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3b1bb">create · retrieve</text>
<text x="220" y="151" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3b1bb">update · delete</text>
<text x="220" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3b1bb">discovery</text>
<rect x="386" y="98" width="172" height="86" rx="6" fill="#102b35" stroke="#2b7085" stroke-width="1.2"/>
<text x="400" y="118" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#e6edf3">sql_action.js</text>
<text x="400" y="136" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3b1bb">statements built</text>
<text x="400" y="151" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3b1bb">with the query</text>
<text x="400" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3b1bb">builder, values bound</text>
