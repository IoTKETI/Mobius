<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Mobius 3.0 architecture: a worker handles a request through app.js, security.js, resource.js and sql_action.js, the mobius/db facade reaches MySQL or SQLite, and responses leave through responder.js while sgn.js sends notifications">
<rect width="880" height="470" fill="#0d1117"/>
<rect x="12" y="10" width="560" height="250" rx="9" fill="#151b22" stroke="#30363d" stroke-width="1.2"/>
<text x="28" y="33" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Request path</text>
<text x="126" y="33" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#7d8b95">worker process</text>
<rect x="26" y="44" width="532" height="46" rx="6" fill="#102b35" stroke="#2b7085" stroke-width="1.2"/>
<text x="40" y="64" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="500" fill="#e6edf3">app.js</text>
